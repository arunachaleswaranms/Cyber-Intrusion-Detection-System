name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  reproduction-environment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-reproduction.txt
      - run: python -m pip install pip==26.2.1
      - run: python -m pip install -r requirements-reproduction.txt
      - run: python -m pytest -q

  workbench-phase-1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
          cache: pip
          cache-dependency-path: requirements-workbench.txt
      - run: python -m pip install pip==26.2.1
      - run: python -m pip install -r requirements-workbench.txt
      - run: python -m pytest -q
